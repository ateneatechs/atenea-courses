version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: lumiere-db
    environment:
      POSTGRES_DB: lumiere_academy
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: lumiere_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lumiere -d lumiere_academy']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumiere-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://lumiere:lumiere_pass@postgres:5432/lumiere_academy
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      FRONTEND_URL: http://localhost
      PORT: 3000
    ports:
      - '3000:3000'
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumiere-frontend
    ports:
      - '5173:80'
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: lumiere-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  seed:
    image: node:20-alpine
    container_name: atenea-seed
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgres://lumiere:lumiere_pass@postgres:5432/lumiere_academy
    command: sh -c "npm ci && npx ts-node --transpile-only src/seed.ts"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
