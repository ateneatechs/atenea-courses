# Internal reverse proxy for the single-client (Naza Barber) deploy.
# Sits behind the host's native nginx, which owns ports 80/443 and terminates
# TLS (shared VPS with other sites — see DEPLOY.md). This container only
# listens on 127.0.0.1:8090 for plain HTTP traffic forwarded by the host.
#
# Routes:
#   /api/      -> backend container
#   /uploads/  -> backend container (user-uploaded logos, etc.)
#   /          -> frontend container (built SPA)

upstream atenea_backend  { server backend:3000; }
upstream atenea_frontend { server frontend:80; }

server {
    listen 80;
    server_name _;

    client_max_body_size 2048M;

    location /api/ {
        proxy_pass http://atenea_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve the scheme the host's nginx saw (https), not this hop's (http).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /uploads/videos/ {
        deny all;
        return 403;
    }

    location /uploads/ {
        proxy_pass http://atenea_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://atenea_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
