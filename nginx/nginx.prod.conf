# Production reverse proxy for the single-client (Naza Barber) deploy.
# Routes:
#   /api/      -> backend container
#   /uploads/  -> backend container (user-uploaded logos, etc.)
#   /          -> frontend container (built SPA)
#
# Starts HTTP-only so the stack works on first boot. To enable HTTPS:
#   1. Point your domain's A record at the VPS.
#   2. Get a cert (see DEPLOY.md):  certbot certonly --webroot -w /var/www/certbot -d DOMAIN
#   3. Uncomment the 443 server block below and the redirect, then: docker compose -f docker-compose.prod.yml restart nginx

upstream atenea_backend  { server backend:3000; }
upstream atenea_frontend { server frontend:80; }

server {
    listen 80;
    server_name _;

    client_max_body_size 2048M;

    # ACME challenge for Let's Encrypt (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Once HTTPS is configured, replace everything below this line with:
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass http://atenea_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://atenea_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location / {
        proxy_pass http://atenea_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

